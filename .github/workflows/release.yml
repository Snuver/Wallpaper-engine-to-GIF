name: Build release ZIP

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repo
        uses: actions/checkout@v4

      - name: Make the clean ZIP
        run: zip -j WE-To-GIF.zip WE-To-GIF.bat WE-To-GIF.py README.md

      - name: Create v1.5 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.5 WE-To-GIF.zip \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Wallpaper GIF Converter v1.5" \
            --notes "First public release of Wallpaper GIF Converter by Snuver. Download WE-To-GIF.zip below, extract it, then run WE-To-GIF.bat."
